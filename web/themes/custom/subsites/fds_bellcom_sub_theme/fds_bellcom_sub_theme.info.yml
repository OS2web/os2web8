name: 'Bellcom Subsite Theme'
type: theme
description: 'Theme for Bellcom subsites.'
core: 8.x
core_version_requirement: ^8 || ^9 || ^10
screenshot: screenshot.png
logo: logo.png
base theme: fds_base_theme
package: OS2web

regions:
  header__logo: 'Header - logo'
  header__top_navigation: 'Header - top navigation'
  header__main_navigation: 'Header - main navigation'
  banner_search: 'Banner search'
  small_search: 'Small search'
  highlighted: Highlighted
  featured_top: 'Featured top'
  breadcrumb: Breadcrumb
  content: Content
  sidebar_first: 'Sidebar first'
  sidebar_second: 'Sidebar second'
  featured_bottom_first: 'Featured bottom first'
  footer__latest_content: 'Footer - latest content'
  footer_first: 'Footer first'
  embedded_code: 'Embedded code'
  gtm_head: 'GTM (head)'
  gtm_body: 'GTM (body start)'

libraries:
  - fds_bellcom_sub_theme/fonts
  - fds_bellcom_sub_theme/styles
  - fds_bellcom_sub_theme/javascripts 

libraries-override:
  fds_base_theme/javascripts:
    js:
      js/slideshow.js: js/slideshow.js

settings:
  fds_bellcom_sub_theme_font_combination: 'default'
